<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>樱梦 Sakura Dream</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <canvas id="overlay"></canvas>
    <div id="toasts"></div>
    <div id="fps"></div>

    <!-- 配置（修改这里） -->
    <script src="config.js"></script>

    <!-- 核心（普通脚本而非 ES Module：file:// 直接打开也能运行） -->
    <script src="js/core/math.js"></script>
    <script src="js/core/config.js"></script>
    <script src="js/core/assets.js"></script>
    <script src="js/core/input.js"></script>
    <script src="js/core/loop.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/params.js"></script>

    <!-- 模拟：花瓣 / 光斑 / 光尘 / 风 / 镜头 / 木偶 -->
    <script src="js/sim/atlas.js"></script>
    <script src="js/sim/batch.js"></script>
    <script src="js/sim/wind.js"></script>
    <script src="js/sim/camera.js"></script>
    <script src="js/sim/petals.js"></script>
    <script src="js/sim/bokeh.js"></script>
    <script src="js/sim/motes.js"></script>
    <script src="js/sim/puppet.js"></script>

    <!-- 渲染：WebGL 主路径 + Canvas 2D 降级 -->
    <script src="js/render/shaders.js"></script>
    <script src="js/render/glutil.js"></script>
    <script src="js/render/webgl-renderer.js"></script>
    <script src="js/render/canvas-renderer.js"></script>

    <script src="js/integrations/wallpaper-engine.js"></script>
    <script src="js/editor/editor.js"></script>
    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
